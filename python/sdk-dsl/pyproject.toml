[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "dsh-bridge"
version = "0.0.0.dev0"
description = "Python decorator library and runtime that exposes a Python module as a Cordis Service / Event listener / capability Provider through the DeepSeek Harness Python Capability Bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/deepseek-ai/deepseek-harness"
Documentation = "https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/python-bridge.md"
Issues = "https://github.com/deepseek-ai/deepseek-harness/issues"
Source = "https://github.com/deepseek-ai/deepseek-harness"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_bridge"]