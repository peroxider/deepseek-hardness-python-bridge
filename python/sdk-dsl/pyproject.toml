[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "dsh-python-bridge"
# Version is single-sourced from `src/dsh_bridge/__init__.py` (`__version__`)
# so the wheel, PyPI listing, and the runtime's initialize handshake never drift.
dynamic = ["version"]
description = "Python decorator library and runtime that exposes a Python module as a Cordis Service / Event listener / capability Provider through the DeepSeek Harness Python Capability Bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]
keywords = [
  "deepseek",
  "deepseek-harness",
  "cordis",
  "plugin",
  "agent",
  "bridge",
  "json-rpc",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
dsh-bridge-runtime = "dsh_bridge.runtime:main"

[project.urls]
Homepage = "https://github.com/peroxider/deepseek-hardness-python-bridge"
Documentation = "https://github.com/peroxider/deepseek-hardness-python-bridge/blob/main/python/sdk-dsl/README.md"
Issues = "https://github.com/peroxider/deepseek-hardness-python-bridge/issues"
Source = "https://github.com/peroxider/deepseek-hardness-python-bridge"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.version]
path = "src/dsh_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_bridge"]
