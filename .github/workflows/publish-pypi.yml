name: Publish dsh-bridge to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'python/sdk-dsl/**'
      - '.github/workflows/publish-pypi.yml'
  pull_request:
    paths:
      - 'python/sdk-dsl/**'
      - '.github/workflows/publish-pypi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        working-directory: python/sdk-dsl
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build

      - name: Run test suite
        working-directory: python/sdk-dsl
        run: PYTHONPATH=src python -m pytest tests/

      - name: Build wheel
        working-directory: python/sdk-dsl
        run: python -m build --outdir dist

      - name: Smoke-test wheel install
        working-directory: python/sdk-dsl
        run: |
          python -m pip install dist/*.whl
          python -c "import dsh_bridge; print(dsh_bridge.__version__)"

  publish:
    # Version tags cut a release; the wheel was built and smoke-tested above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dsh-bridge
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        working-directory: python/sdk-dsl
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        working-directory: python/sdk-dsl
        run: python -m build --outdir dist

      # Trusted publishing (OIDC): requires a PyPI publisher for this repo to be
      # configured on pypi.org/p/dsh-bridge. Until then, publish the first
      # release manually from a local build:
      #   cd python/sdk-dsl && python -m pip install build twine
      #   python -m build --outdir dist && twine upload dist/*
      # (an alternative is a PYPI_API_TOKEN secret with twine in this step).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/sdk-dsl/dist/
